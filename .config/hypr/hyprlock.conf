$font = MonaspiceNe Nerd Font

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffee)
    font_size = 110
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(ffffffaa)
    font_size = 22
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

# user avatar / greeting
label {
    monitor =
    text =   $USER
    color = rgba(ffffffcc)
    font_size = 18
    font_family = $font
    position = 0, 50
    halign = center
    valign = bottom
}

# password input
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(33ccffee)
    inner_color = rgba(1a1a1add)
    font_color = rgba(ffffffee)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff3355ee)

    fade_on_empty = false
    placeholder_text = <span foreground="##aaaaaa"></span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 12
    position = 0, 120
    halign = center
    valign = bottom
}
